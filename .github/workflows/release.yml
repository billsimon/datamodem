# Release builds for macOS (Apple Silicon), Linux (x86_64, arm64) and Windows
# (x86_64, under Cygwin). Every push and pull request builds and tests all
# four; pushing a tag vX.Y.Z also publishes them as a GitHub release.
#
# spandsp, pjproject and OpenSSL are built from source by
# scripts/build-deps.sh and linked statically, so each binary needs only
# what the OS provides: macOS's frameworks, glibc 2.28+ on Linux (and ALSA,
# loaded only for --speaker), and cygwin1.dll (shipped beside it) on Windows. They are cached until that
# script changes.
name: Release builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  macos:
    name: ${{ matrix.target }}
    runs-on: macos-15
    strategy:
      matrix:
        target: [macos-arm64]
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: brew install libtiff pkgconf

      # Restored from the newest run that built any of them; the script
      # skips whatever is already there and builds the rest, and what it
      # built is saved even if a later step fails.
      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: deps
          key: deps-${{ matrix.target }}-${{ hashFiles('scripts/build-deps.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: deps-${{ matrix.target }}-${{ hashFiles('scripts/build-deps.sh') }}-

      - name: Build dependencies
        id: deps
        run: |
          echo "before=$(ls deps/.built-* 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
          DEPS_DOWNLOADS=$RUNNER_TEMP/deps-src scripts/build-deps.sh deps

      - name: Note what was built
        id: built
        if: always()
        run: |
          after=$(ls deps/.built-* 2>/dev/null | wc -l)
          [ "$after" -gt "${{ steps.deps.outputs.before || 0 }}" ] && echo "new=true" >> "$GITHUB_OUTPUT" || true

      - name: Save dependencies
        if: always() && steps.built.outputs.new == 'true'
        uses: actions/cache/save@v6
        with:
          path: deps
          key: deps-${{ matrix.target }}-${{ hashFiles('scripts/build-deps.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DDATAMODEM_STATIC_DEPS=ON -DCMAKE_PREFIX_PATH="$PWD/deps"
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          build/datamodem version
          for m in v34 v32bis v32 v22bis v22 v23 v21 bell103; do
            build/datamodem selftest --modulation $m --no-step-down
          done

      - name: Check what the binary links against
        run: |
          otool -L build/datamodem
          if otool -L build/datamodem | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "::error::linked against a library macOS does not ship"; exit 1
          fi

      - name: Package
        id: package
        run: |
          ver=$(sed -n 's/^#define DATAMODEM_VERSION "\(.*\)"/\1/p' include/datamodem/version.h)
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) ver="$ver-dev.${GITHUB_SHA:0:7}" ;;
          esac
          name=datamodem-$ver-${{ matrix.target }}
          mkdir -p "dist/$name"
          cmake --install build --prefix "$RUNNER_TEMP/install" --strip
          cp "$RUNNER_TEMP/install/bin/datamodem" "dist/$name/"
          cp README.md examples/datamodem.conf "dist/$name/"
          cp -R deps/share/licenses "dist/$name/licenses"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  # Built in the manylinux_2_28 image - AlmaLinux 8 with a current GCC - so
  # the binary asks for nothing newer than glibc 2.28: RHEL 8, Debian 10,
  # Ubuntu 20.04 and everything since.
  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}:${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
            image: '2026.10.03-1'
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
            image: '2026.10.03-1'
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          dnf install -y libtiff-devel alsa-lib-devel pkgconf-pkg-config perl xz
          command -v cmake >/dev/null || dnf install -y cmake
          gcc --version | head -1
          cmake --version | head -1
          # The checkout belongs to the runner's user, not the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Restored from the newest run that built any of them; the script
      # skips whatever is already there and builds the rest, and what it
      # built is saved even if a later step fails.
      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: deps
          key: deps-${{ matrix.target }}-manylinux_2_28-${{ matrix.image }}-${{ hashFiles('scripts/build-deps.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: deps-${{ matrix.target }}-manylinux_2_28-${{ matrix.image }}-${{ hashFiles('scripts/build-deps.sh') }}-

      - name: Build dependencies
        id: deps
        run: |
          echo "before=$(ls deps/.built-* 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
          DEPS_DOWNLOADS=$RUNNER_TEMP/deps-src scripts/build-deps.sh deps

      - name: Note what was built
        id: built
        if: always()
        run: |
          after=$(ls deps/.built-* 2>/dev/null | wc -l)
          [ "$after" -gt "${{ steps.deps.outputs.before || 0 }}" ] && echo "new=true" >> "$GITHUB_OUTPUT" || true

      - name: Save dependencies
        if: always() && steps.built.outputs.new == 'true'
        uses: actions/cache/save@v6
        with:
          path: deps
          key: deps-${{ matrix.target }}-manylinux_2_28-${{ matrix.image }}-${{ hashFiles('scripts/build-deps.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DDATAMODEM_STATIC_DEPS=ON -DCMAKE_PREFIX_PATH="$PWD/deps"
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          build/datamodem version
          for m in v34 v32bis v32 v22bis v22 v23 v21 bell103; do
            build/datamodem selftest --modulation $m --no-step-down
          done

      - name: Check what the binary links against
        run: |
          readelf -d build/datamodem | grep NEEDED
          if readelf -d build/datamodem | grep NEEDED |
              grep -vE '\[(libc|libm|libpthread|libdl|librt)\.so\.[0-9]+\]|\[ld-linux[^]]*\]'; then
            echo "::error::linked against a library outside glibc"; exit 1
          fi
          need=$(objdump -T build/datamodem | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "needs glibc $need"
          if [ "$(printf '%s\n' "$need" 2.28 | sort -V | tail -1)" != 2.28 ]; then
            echo "::error::needs glibc $need, newer than 2.28"; exit 1
          fi

      - name: Package
        id: package
        run: |
          ver=$(sed -n 's/^#define DATAMODEM_VERSION "\(.*\)"/\1/p' include/datamodem/version.h)
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) ver="$ver-dev.${GITHUB_SHA:0:7}" ;;
          esac
          name=datamodem-$ver-${{ matrix.target }}
          mkdir -p "dist/$name"
          cmake --install build --prefix "$RUNNER_TEMP/install" --strip
          cp "$RUNNER_TEMP/install/bin/datamodem" "dist/$name/"
          cp README.md examples/datamodem.conf "dist/$name/"
          cp -R deps/share/licenses "dist/$name/licenses"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  # The packaged binary away from the image it was built in: on Debian 10,
  # glibc 2.28 and no ALSA, the oldest and barest it claims to run on; then
  # on stock Ubuntu with ALSA's JACK plugin enabled and no JACK server, where
  # libjack complains whenever anything opens ALSA's "jack" PCM.
  linux-check:
    name: ${{ matrix.target }} elsewhere
    needs: linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}

      - name: Unpack
        run: |
          tar xzf datamodem-*.tar.gz
          ln -s datamodem-*/datamodem .

      - name: Run on Debian 10, with no ALSA
        run: |
          cat > check.sh <<'EOF'
          set -e
          ./datamodem version
          for m in v34 v32bis v22bis v21; do
            ./datamodem selftest --modulation $m --no-step-down >/dev/null
          done
          # Through pjsua's startup to a registration that fails: exit 4.
          for speaker in "" --speaker; do
            status=0
            ./datamodem answer --server 127.0.0.1 --username ci --password ci --reg-timeout 1 $speaker \
              </dev/null >/dev/null 2>/tmp/startup.err || status=$?
            cat /tmp/startup.err
            [ "$status" -eq 4 ] || { echo "expected exit 4 ($speaker), got $status"; exit 1; }
          done
          grep -q 'ALSA (libasound.so.2) is not installed' /tmp/startup.err
          EOF
          # Read-only, so nothing in the checkout ends up owned by root.
          docker run --rm -v "$PWD:/w:ro" -w /w debian:buster-slim sh check.sh

      - name: Check startup is quiet under ALSA's JACK plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 libasound2-plugins alsa-utils >/dev/null
          # Debian ships the plugin's config but leaves it to be enabled.
          sudo mkdir -p /etc/alsa/conf.d
          sudo ln -sf /usr/share/alsa/alsa.conf.d/50-jack.conf /etc/alsa/conf.d/
          # pjmedia probes the PCMs ALSA lists as hints; jack has to be one,
          # and opening it has to make libjack talk, or this proves nothing.
          aplay -L | grep -qx jack || { echo "::error::ALSA lists no jack PCM"; exit 1; }
          aplay -D jack -d 1 -t raw /dev/null >aplay.err 2>&1 || true
          if ! grep -qi 'jack server' aplay.err; then
            echo "::error::libjack was silent for aplay too: $(head -c 600 aplay.err | tr '\n' ' ')"; exit 1
          fi
          # Without --speaker ALSA isn't touched; with it, every PCM is probed.
          for speaker in "" --speaker; do
            status=0
            ./datamodem answer --server 127.0.0.1 --username ci --password ci --reg-timeout 1 $speaker \
              </dev/null >/dev/null 2>startup.err || status=$?
            cat startup.err
            if [ "$status" -ne 4 ]; then
              echo "::error::expected exit 4 with no registrar there ($speaker), got $status"; exit 1
            fi
            if grep -i jack startup.err; then
              echo "::error::libjack spoke during startup ($speaker)"; exit 1
            fi
          done

  windows:
    name: windows-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -o igncr -eo pipefail '{0}'
    env:
      # A login shell, for Cygwin's PATH alone, that stays in the checkout.
      CYGWIN_NOWINPATH: '1'
      CHERE_INVOKING: '1'
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: C:\cygwin
          packages: >-
            gcc-core gcc-g++ make cmake pkg-config perl curl tar xz zip file
            libtiff-devel

      # Restored from the newest run that built any of them; the script
      # skips whatever is already there and builds the rest, and what it
      # built is saved even if a later step fails.
      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: deps
          key: deps-windows-x86_64-${{ hashFiles('scripts/build-deps.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: deps-windows-x86_64-${{ hashFiles('scripts/build-deps.sh') }}-

      - name: Build dependencies
        id: deps
        run: |
          echo "before=$(ls deps/.built-* 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
          DEPS_DOWNLOADS=$(cygpath "$RUNNER_TEMP")/deps-src scripts/build-deps.sh deps

      - name: Note what was built
        id: built
        if: always()
        run: |
          after=$(ls deps/.built-* 2>/dev/null | wc -l)
          [ "$after" -gt "${{ steps.deps.outputs.before || 0 }}" ] && echo "new=true" >> "$GITHUB_OUTPUT" || true

      - name: Save dependencies
        if: always() && steps.built.outputs.new == 'true'
        uses: actions/cache/save@v6
        with:
          path: deps
          key: deps-windows-x86_64-${{ hashFiles('scripts/build-deps.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Cygwin has no git of its own; the checkout's is Windows'.
      - name: Note the commit time
        shell: pwsh
        run: |
          "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $env:GITHUB_ENV

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DDATAMODEM_STATIC_DEPS=ON -DCMAKE_PREFIX_PATH="$PWD/deps"
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          build/datamodem version
          for m in v34 v32bis v32 v22bis v22 v23 v21 bell103; do
            build/datamodem selftest --modulation $m --no-step-down
          done

      - name: Check startup
        run: |
          # Through pjsua's startup to a registration that fails: exit 4.
          status=0
          build/datamodem answer --server 127.0.0.1 --username ci --password ci --reg-timeout 1 \
            --log-level debug --pjsip-log-level 5 </dev/null >/dev/null 2>startup.err || status=$?
          cat startup.err
          [ "$status" -eq 4 ] || { echo "::error::expected exit 4, got $status"; exit 1; }

      - name: Check what the binary links against
        run: |
          # Everything but cygwin1.dll should be Windows' own.
          cygcheck build/datamodem.exe
          if cygcheck build/datamodem.exe | sed 's/^ *//' | grep -viE '^(c:\\windows\\|.*\\cygwin1\.dll$)' | grep -iE '\.dll$'; then
            echo "::error::needs a DLL other than cygwin1.dll"; exit 1
          fi

      - name: Package
        id: package
        run: |
          ver=$(sed -n 's/^#define DATAMODEM_VERSION "\(.*\)"/\1/p' include/datamodem/version.h)
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) ver="$ver-dev.${GITHUB_SHA:0:7}" ;;
          esac
          name=datamodem-$ver-windows-x86_64
          mkdir -p "dist/$name"
          strip -o "dist/$name/datamodem.exe" build/datamodem.exe
          cp /usr/bin/cygwin1.dll "dist/$name/"
          cp README.md examples/datamodem.conf "dist/$name/"
          cp -R deps/share/licenses "dist/$name/licenses"
          mkdir -p "dist/$name/licenses/cygwin"
          find /usr/share/doc -maxdepth 2 -ipath '*cygwin*' \( -iname 'COPYING*' -o -iname '*LICENSE*' \) \
            -exec cp {} "dist/$name/licenses/cygwin/" \;
          ls -l "dist/$name/licenses/cygwin"
          cat > "dist/$name/licenses/cygwin/SOURCE.txt" <<EOF
          cygwin1.dll is Cygwin $(uname -r), under the LGPLv3.
          Its source is at https://cygwin.com/git/?p=newlib-cygwin.git
          EOF
          (cd dist && zip -qr "$name.zip" "$name")
          echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, linux-check, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        run: |
          ver=$(sed -n 's/^#define DATAMODEM_VERSION "\(.*\)"/\1/p' include/datamodem/version.h)
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but version.h says $ver"; exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "datamodem ${GITHUB_REF_NAME#v}" $prerelease *
