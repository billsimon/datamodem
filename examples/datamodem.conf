# datamodem configuration. Every key is the long form of a command line flag
# with the leading dashes removed; pass it with --config /etc/datamodem.conf.
#
# Precedence: command line flags > DATAMODEM_* environment > this file > defaults.

# --- SIP account -----------------------------------------------------------
server        = sip.example.com
username      = 1001
auth-user     = 1001
# Leave the password out of the file and set DATAMODEM_PASSWORD instead.
# password    = secret
reg-expires   = 300

# Registration defaults to off when dialling (the INVITE carries the digest
# response instead) and on when answering. Set it explicitly only to override:
# register    = true      # PBX that refuses calls from unregistered accounts
# register    = false     # inbound fed by a static route or IP trust
# proxy       = sip:edge.example.com;lr
# caller-id   = +15550001111

# --- Transport -------------------------------------------------------------
transport     = udp
local-port    = 5060
# Media never strays outside [rtp-port, rtp-port + rtp-port-range]. Open
# exactly this range on the firewall and the SBC; a narrower allowance shows
# up as a call that connects and then never trains.
rtp-port        = 4000
rtp-port-range  = 100
# public-addr = 203.0.113.10      # when NAT sits between us and the trunk
# stun        = stun.example.com

# --- Media -----------------------------------------------------------------
# G.711 only, always. Anything compressed - G.729, Opus, GSM - is built to
# carry speech and will destroy a modem signal completely.
codec             = pcmu
# A bigger jitter buffer costs round-trip delay, which an interactive session
# feels; a smaller one starves the demodulator. 150 ms is a reasonable start
# on a real trunk, and 60 is usually fine on a LAN.
jitter-buffer-ms  = 150

# --- Modem -----------------------------------------------------------------
# v34 (33600 down to 2400), v32bis (14400 down to 4800), v32 (9600/4800),
# v22bis (2400), v22 (1200), v23 (1200 down / 75 up), v21 (300), bell103 (300).
# All of them carry data. V.22bis needs third_party/spandsp-v22bis compiled in
# (it is, by default) because the V.22bis in most packaged libspandsp builds
# trains and then delivers a constant 0x55 - see the README.
#
# The default is v34, which steps down to whatever the far end turns out to
# be - v32bis, v22bis, v21 or bell103 - calling or answering, the way a modem
# with its factory settings does. This sets where it starts; step-down = no
# keeps it there. A path too poor for anything but 300 bps FSK is not
# something stepping down notices: start at v21 (or bell103) for that.
#
# V.21 is the international 300 bps standard; Bell 103 is the North American
# one; stepping down tries both.
modulation    = v34
step-down     = true
# The most to offer: 14400, 12000, 9600, 7200 or 4800 for v32bis, 9600 or
# 4800 for v32, 2400 or 1200 for v22bis. 0 means the most the modulation can
# do. V.32 and V.32bis settle for less by themselves on a line that will not
# bear it, and V.32bis changes rate mid-call as the line does.
bit-rate      = 0
# The answering modem's guard tone. 1800 Hz is a European PSTN requirement;
# on a VoIP trunk you almost never want one.
guard-tone    = none

# Character framing. 8N1 is what everything modern expects; 7E1 is what a lot
# of older BBS and host systems want.
data-bits     = 8
parity        = none
stop-bits     = 1
v14           = true

# Call setup timing. The answering end announces itself with a 2100 Hz tone
# before it trains. The calling end sits quiet for answer-wait seconds first -
# long enough to cover a full-length V.25 tone (2.6 to 4 seconds) whether or
# not the detector notices it - and if it does hear the tone, extends the wait
# to answer-tail-ms after hearing it. Hearing the tone never shortens the wait:
# training on top of a tone that is still playing is how you get a connection
# that comes up and immediately drops.
answer-tone-ms = 3300
answer-wait    = 5
answer-tail-ms = 3300
calling-tone   = false
train-timeout  = 45
# A V.22bis link that keeps retraining is usually two ends that disagreed
# about the rate - one missed the other's S1 and settled at 1200 while the
# other stayed at 2400. Give up rather than spew noise; --bit-rate 1200
# avoids the disagreement entirely.
max-retrains   = 4
tx-power       = -13

# --- Error correction and compression ---------------------------------------
# detect | require | off. detect, the default, is what a modem with its
# factory settings does: V.42 if the far end does it, a direct async link if
# not. The price, against a far end that has never heard of V.42, is the
# detection pattern - DC1s, which async hosts take for XON - on the line for
# a second or so (several at 300 bps) before the fallback.
#
#   detect   try, and drop back to direct async if nobody answers
#   require  try, and give up on the call if nobody answers
#   off      direct async from the start, with no handshake
#
# With V.42 running there are no start and stop bits on the line at all - the
# bit stream is HDLC frames - so data-bits, parity and stop-bits above stop
# meaning anything.
#
# V.42 cannot run over v23: one LAPM frame takes 14 seconds to send on V.23's
# 75 bps back channel, against a one second acknowledgement timer. detect
# runs v23 without it; require is refused there.
v42           = detect
# Backstop only. spandsp reports a failed detection itself (once its timers
# are scaled to the line rate, which datamodem does - see the README), and
# the fallback happens then. This covers the case where it says nothing at
# all. Measured from carrier up.
v42-timeout   = 10

# V.42bis compression, offered inside V.42 (on by default). A far end that
# declines it gets V.42 alone; with no V.42 there is nothing to offer it in,
# and it never runs on an uncorrected link - both ends build a shared
# dictionary as they go, so one bad byte would desynchronise them for good.
v42bis        = true
# The most to offer in V.42's XID exchange. The far end may take less, or
# decline compression altogether, and the link runs whatever was agreed.
# 2048/32 is what real modems shipped with.
v42bis-dict        = 2048
v42bis-max-string  = 32

# --- Session ---------------------------------------------------------------
# The Hayes escape: pause, +++, pause. The guard time either side is what
# stops a "+++" inside real data from dropping you into command mode.
escape-char     = +
escape-guard-ms = 1000
# An immediate one-keystroke escape, off by default because a real modem has
# no such thing. Handy when the far end is wedged and you are in raw mode.
# escape-key    = ^]
local-echo      = false

connect-timeout = 60
# answer-timeout = 0        # `datamodem answer` waits forever by default
# idle-timeout   = 0        # hang up after this long with nothing received
media-timeout    = 20       # no RTP at all means the media path is broken
# max-call       = 3600
#
# Answering for a BBS: run a command per call with the line as its stdin and
# stdout, and keep answering. See "Answering for a BBS" in the README.
# exec           = x84-modem-bridge --port 6510
# exec-tty       = false    # true for a shell or login, which need a terminal
# calls          = 0

# --- Logging ---------------------------------------------------------------
# Logs go to stderr; stdout carries only what the remote system sent. Point
# log-file somewhere to get the diagnostics off the terminal entirely.
log-level     = info
log-json      = false
# log-file    = /var/log/datamodem.log
